[project]
name = "shelf-admin"
version = "0.1.0"
description = "Offline data prep for Shelf Finder"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "ruamel-yaml>=0.19.1",
]

[project.scripts]
shelf-admin = "shelf_admin.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shelf_admin"]
